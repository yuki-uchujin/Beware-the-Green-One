# Beware the Green One - mods.toml

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# This mod is client-side only.
clientSideOnly=true

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

authors="${mod_authors}"

logoFile="mod_icon.png"

mixinConfigs=[
    "bewarethegreenone.mixins.json"
]

description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"